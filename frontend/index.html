<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zone Trading Terminal</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #30363d;
    --text: #e6edf3; --muted: #8b949e;
    --green: #3fb950; --red: #f85149; --accent: #58a6ff;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, "Noto Sans Devanagari", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  header.topbar {
    position: sticky; top: 0; z-index: 10;
    padding: env(safe-area-inset-top, 0px) 0 0 0;
    background: var(--panel); border-bottom: 1px solid var(--border);
  }
  #headerStrip {
    display: flex; overflow-x: auto; gap: 14px; padding: 8px 12px;
    white-space: nowrap; font-size: 12px;
  }
  #headerStrip .item { display: flex; flex-direction: column; min-width: 72px; }
  #headerStrip .sym { color: var(--muted); font-size: 10px; }
  #headerStrip .chg.up { color: var(--green); }
  #headerStrip .chg.down { color: var(--red); }

  .appTitle { display:flex; align-items:center; justify-content:space-between; padding: 8px 12px 0; }
  .appTitle h1 { font-size: 16px; margin: 0; font-weight: 600; }
  .modeBadge {
    font-size: 11px; padding: 3px 8px; border-radius: 12px; border: 1px solid var(--border);
  }
  .modeBadge.paper { color: var(--accent); }
  .modeBadge.algo { color: var(--red); border-color: var(--red); }

  nav.tabs { display: flex; border-bottom: 1px solid var(--border); }
  nav.tabs button {
    flex: 1; background: none; border: none; color: var(--muted);
    padding: 10px 0; font-size: 13px; border-bottom: 2px solid transparent;
  }
  nav.tabs button.active { color: var(--text); border-bottom-color: var(--accent); }

  main { padding: 10px 10px calc(70px + env(safe-area-inset-bottom, 0px)); }
  .page { display: none; }
  .page.active { display: block; }

  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px; margin-bottom: 8px;
  }
  .zoneRow .top { display: flex; justify-content: space-between; align-items: center; }
  .zoneRow .symbol { font-weight: 600; font-size: 14px; }
  .tag { font-size: 10px; padding: 2px 7px; border-radius: 6px; }
  .tag.demand { background: rgba(63,185,80,0.15); color: var(--green); }
  .tag.supply { background: rgba(248,81,73,0.15); color: var(--red); }
  .grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-top: 6px; font-size: 11px; }
  .grid4 .label { color: var(--muted); }
  .hypothesis { margin-top: 6px; font-size: 12px; color: var(--text); line-height: 1.4; }
  .conflict-warn { margin-top: 6px; font-size: 11px; color: var(--red); }
  a.chartlink { font-size: 11px; color: var(--accent); text-decoration: none; }
  .execBtn {
    margin-left: auto; font-size: 11px; padding: 5px 10px; border-radius: 6px;
    border: 1px solid var(--accent); background: none; color: var(--accent);
  }
  .execBtn:active { background: var(--accent); color: #001; }

  .instRow { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .instRow:last-child { border-bottom: none; }
  .instRow .name { font-size: 13px; }
  .instRow .price { font-size: 13px; text-align: right; }

  .settingsForm label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
  .settingsForm input, .settingsForm select {
    width: 100%; padding: 8px; background: #0d1117; border: 1px solid var(--border);
    color: var(--text); border-radius: 6px; font-size: 14px;
  }
  .settingsForm button {
    margin-top: 14px; width: 100%; padding: 10px; background: var(--accent);
    color: #001; border: none; border-radius: 8px; font-weight: 600;
  }

  .empty { color: var(--muted); font-size: 13px; text-align: center; padding: 30px 0; }
  #notifBar {
    position: fixed; bottom: calc(56px + env(safe-area-inset-bottom, 0px)); left: 0; right: 0;
    background: #1f2937; border-top: 1px solid var(--border);
    font-size: 11px; padding: 6px 10px; overflow-x: auto; white-space: nowrap; display: none;
  }
  #notifBar.show { display: block; }
  footer.tabbar {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 10;
    display: flex; background: var(--panel); border-top: 1px solid var(--border);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  footer.tabbar button { flex: 1; background: none; border: none; color: var(--muted); padding: 10px 0; font-size: 12px; }
  footer.tabbar button.active { color: var(--accent); }
</style>
</head>
<body>

<header class="topbar">
  <div class="appTitle">
    <h1>⚡ Zone Terminal</h1>
    <span id="modeBadge" class="modeBadge paper">PAPER</span>
  </div>
  <div id="headerStrip"></div>
</header>

<main>
  <section id="page-home" class="page active">
    <div id="zonesList"><div class="empty">Scanning शुरू हो रहा है...</div></div>
  </section>

  <section id="page-instruments" class="page">
    <div class="card">
      <div id="instrumentsList"><div class="empty">Loading...</div></div>
    </div>
  </section>

  <section id="page-settings" class="page">
    <div class="card settingsForm">
      <label>Trading Mode</label>
      <select id="tradingMode">
        <option value="paper">Paper</option>
        <option value="manual">Manual</option>
        <option value="algo">Algo</option>
      </select>

      <label>Capital (₹)</label>
      <input id="capital" type="number" step="100">

      <label>Risk per trade (%)</label>
      <input id="riskPct" type="number" step="0.1">

      <label>Target RR</label>
      <input id="targetRR" type="number" step="0.5">

      <label>Scan Range (± % of EOD high/low)</label>
      <input id="scanRange" type="number" step="1">

      <label>Proximal Alert (%)</label>
      <input id="proximalPct" type="number" step="0.1">

      <button onclick="saveSettings()">सेव करें</button>
    </div>

    <div class="card">
      <div style="font-size:13px; font-weight:600; margin-bottom:6px;">Data Sources</div>
      <div id="sourcesStatus" style="font-size:12px; color:var(--muted);">Loading...</div>
    </div>

    <div class="card">
      <div style="font-size:13px; font-weight:600; margin-bottom:6px;">FII/DII (पिछले 3 दिन)</div>
      <div id="fiiDii" style="font-size:12px;">Loading...</div>
    </div>

    <div class="card">
      <div style="font-size:13px; font-weight:600; margin-bottom:6px;">News / Events</div>
      <div id="newsList" style="font-size:12px;">Loading...</div>
    </div>

    <div class="card">
      <div style="font-size:13px; font-weight:600; margin-bottom:6px;">Trade History (Paper/Manual/Algo)</div>
      <div id="tradeHistory" style="font-size:12px;">Loading...</div>
    </div>
  </section>
</main>

<div id="notifBar"></div>

<footer class="tabbar">
  <button data-page="home" class="active" onclick="showPage('home')">📊 Zones</button>
  <button data-page="instruments" onclick="showPage('instruments')">🌐 Instruments</button>
  <button data-page="settings" onclick="showPage('settings')">⚙️ Settings</button>
</footer>

<script>
const API = ""; // same-origin; change to your backend URL if hosted separately

function showPage(name) {
  document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
  document.getElementById("page-" + name).classList.add("active");
  document.querySelectorAll("footer.tabbar button").forEach(b => b.classList.remove("active"));
  document.querySelector(`footer.tabbar button[data-page="${name}"]`).classList.add("active");
}

async function safeFetch(url) {
  try {
    const r = await fetch(API + url);
    if (!r.ok) return null;
    return await r.json();
  } catch (e) { return null; }
}

async function loadHeaderStrip() {
  const data = await safeFetch("/api/instruments/header");
  const el = document.getElementById("headerStrip");
  if (!data) { el.innerHTML = '<span class="empty">Header data unavailable</span>'; return; }
  el.innerHTML = data.header.map(h => {
    const p = h.price;
    const ok = p && p.ok;
    const chgCls = ok && p.change_pct >= 0 ? "up" : "down";
    return `<div class="item">
      <span class="sym">${h.symbol}</span>
      <span>${ok ? p.price : "—"}</span>
      <span class="chg ${chgCls}">${ok ? (p.change_pct >= 0 ? "+" : "") + p.change_pct + "%" : "N/A"}</span>
    </div>`;
  }).join("");
}

async function loadZones() {
  const data = await safeFetch("/api/zones?eligible_only=true");
  const el = document.getElementById("zonesList");
  if (!data || data.count === 0) {
    el.innerHTML = '<div class="empty">अभी कोई वैलिड zone नहीं मिला। (candle source अभी backend में wire नहीं हुआ है, देखें README)</div>';
    return;
  }
  el.innerHTML = data.zones.map(z => `
    <div class="card zoneRow">
      <div class="top">
        <span class="symbol">${z.symbol} <span style="color:var(--muted);font-weight:400;">(${z.timeframe})</span></span>
        <span class="tag ${z.isDemand ? "demand" : "supply"}">${z.isDemand ? "D" : "S"}</span>
      </div>
      <div class="grid4">
        <div><div class="label">Entry</div>${z.entry}</div>
        <div><div class="label">SL</div>${z.stopLoss}</div>
        <div><div class="label">Target</div>${z.target}</div>
        <div><div class="label">Qty</div>${z.quantity}</div>
      </div>
      <div class="hypothesis">🧠 ${z.hypothesis || ""}</div>
      ${z.nifty_conflict && z.nifty_conflict.conflict ? '<div class="conflict-warn">⚠️ Nifty 50 में विपरीत ज़ोन सक्रिय है</div>' : ""}
      <div style="display:flex; gap:8px; margin-top:8px; align-items:center;">
        ${z.tradingview_link ? `<a class="chartlink" href="${z.tradingview_link}" target="_blank">TradingView चार्ट →</a>` : ""}
        <button class="execBtn" onclick='executeTrade(${JSON.stringify(z).replace(/'/g, "&apos;")})'>ट्रेड लें</button>
      </div>
    </div>
  `).join("");
}

async function loadInstruments() {
  const data = await safeFetch("/api/instruments/live");
  const el = document.getElementById("instrumentsList");
  if (!data) { el.innerHTML = '<div class="empty">Unavailable</div>'; return; }
  el.innerHTML = data.instruments.map(i => {
    const p = i.price; const ok = p && p.ok;
    const cls = ok && p.change_pct >= 0 ? "up" : "down";
    return `<div class="instRow">
      <span class="name">${i.symbol}</span>
      <span class="price">
        ${ok ? p.price : "—"}
        <span class="chg ${cls}" style="margin-left:6px;">${ok ? (p.change_pct>=0?"+":"")+p.change_pct+"%" : "N/A"}</span>
        ${i.tradingview_link ? `<a class="chartlink" href="${i.tradingview_link}" target="_blank" style="margin-left:8px;">📈</a>` : ""}
      </span>
    </div>`;
  }).join("");
}

async function loadSettings() {
  const data = await safeFetch("/api/settings");
  if (!data) return;
  document.getElementById("tradingMode").value = data.trading_mode;
  document.getElementById("capital").value = data.capital;
  document.getElementById("riskPct").value = data.risk_pct;
  document.getElementById("targetRR").value = data.target_rr;
  document.getElementById("scanRange").value = data.scan_range_pct;
  document.getElementById("proximalPct").value = data.proximal_alert_pct;

  const badge = document.getElementById("modeBadge");
  badge.textContent = data.trading_mode.toUpperCase();
  badge.className = "modeBadge " + (data.trading_mode === "algo" ? "algo" : "paper");

  const sourcesEl = document.getElementById("sourcesStatus");
  sourcesEl.innerHTML = Object.entries(data.sources).map(([k, v]) =>
    `${v ? "✅" : "⬜"} ${k}`
  ).join("<br>");
}

async function saveSettings() {
  const body = {
    trading_mode: document.getElementById("tradingMode").value,
    capital: parseFloat(document.getElementById("capital").value),
    risk_pct: parseFloat(document.getElementById("riskPct").value),
    target_rr: parseFloat(document.getElementById("targetRR").value),
    scan_range_pct: parseFloat(document.getElementById("scanRange").value),
    proximal_alert_pct: parseFloat(document.getElementById("proximalPct").value),
  };
  try {
    const r = await fetch(API + "/api/settings", {
      method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)
    });
    if (r.ok) { alert("Settings सेव हो गईं"); loadSettings(); }
    else { const err = await r.json(); alert("Error: " + (err.detail || r.status)); }
  } catch (e) { alert("Network error: " + e); }
}

async function loadFiiDii() {
  const data = await safeFetch("/api/fii-dii");
  const el = document.getElementById("fiiDii");
  if (!data || !data.ok) { el.innerHTML = "उपलब्ध नहीं"; return; }
  el.innerHTML = data.rows.map(r => `${r.date} — ${r.category}: नेट ₹${r.net_value_cr} करोड़`).join("<br>")
    + `<br><a class="chartlink" href="${data.stockedge_url}" target="_blank">StockEdge पर पूरा विवरण →</a>`;
}

async function loadNews() {
  const data = await safeFetch("/api/news");
  const el = document.getElementById("newsList");
  if (!data || !data.items || data.items.length === 0) { el.innerHTML = "कोई सत्यापित न्यूज़ नहीं"; return; }
  el.innerHTML = data.items.slice(0, 10).map(n =>
    `<div style="margin-bottom:6px;">${n.verified ? "✅" : "🔹"} ${n.headline} <span style="color:var(--muted);">(${n.source})</span></div>`
  ).join("");
}

async function loadProximalAlerts() {
  const data = await safeFetch("/api/alerts/proximal");
  const bar = document.getElementById("notifBar");
  if (!data || data.count === 0) { bar.classList.remove("show"); return; }
  bar.classList.add("show");
  bar.innerHTML = data.alerts.map(a =>
    `🔔 ${a.symbol} (${a.timeframe}) ${a.zone_type} zone ${a.distance_pct}% दूर`
  ).join(" &nbsp;|&nbsp; ");
}

function showNotifBarFromAlerts(alerts) {
  const bar = document.getElementById("notifBar");
  if (!alerts || alerts.length === 0) { bar.classList.remove("show"); return; }
  bar.classList.add("show");
  bar.innerHTML = alerts.map(a =>
    `🔔 ${a.symbol} (${a.timeframe}) ${a.zone_type} zone ${a.distance_pct}% दूर`
  ).join(" &nbsp;|&nbsp; ");
}

async function executeTrade(setup) {
  const mode = document.getElementById("tradingMode").value;
  let confirm_flag = false;
  if (mode === "algo") {
    confirm_flag = window.confirm(
      `${setup.symbol} पर असली ऑर्डर Dhan को भेजा जाएगा (Qty: ${setup.quantity}, Entry: ${setup.entry}).\nपक्का भेजें?`
    );
    if (!confirm_flag) return;
  }
  try {
    const r = await fetch(API + "/api/execute", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ setup, confirm: confirm_flag }),
    });
    const data = await r.json();
    alert(data.message || (data.ok ? "हो गया" : "असफल"));
    loadTradeHistory();
  } catch (e) { alert("Network error: " + e); }
}

async function loadTradeHistory() {
  const data = await safeFetch("/api/trades?limit=20");
  const el = document.getElementById("tradeHistory");
  if (!data || data.count === 0) { el.innerHTML = "अभी कोई ट्रेड लॉग नहीं"; return; }
  el.innerHTML = data.trades.map(t => {
    const s = t.setup || {};
    return `<div style="margin-bottom:6px; border-bottom:1px solid var(--border); padding-bottom:4px;">
      <b>${s.symbol || "?"}</b> — ${t.mode.toUpperCase()} — ${t.status}
      <span style="color:var(--muted);"> (${new Date(t.logged_at).toLocaleString()})</span>
    </div>`;
  }).join("");
}

// --- WebSocket for real-time proximal alerts (falls back to the 15s
// polling above if the socket can't connect, e.g. behind a proxy that
// blocks websockets) ---
function connectAlertsSocket() {
  try {
    const proto = location.protocol === "https:" ? "wss:" : "ws:";
    const ws = new WebSocket(`${proto}//${location.host}/ws/alerts`);
    ws.onmessage = (ev) => {
      try {
        const msg = JSON.parse(ev.data);
        if (msg.type === "proximal_alerts") showNotifBarFromAlerts(msg.alerts);
      } catch (e) { /* ignore malformed frame */ }
    };
    ws.onclose = () => setTimeout(connectAlertsSocket, 5000); // auto-reconnect
    ws.onerror = () => ws.close();
  } catch (e) {
    console.warn("WebSocket unavailable, relying on polling only:", e);
  }
}

function refreshAll() {
  loadHeaderStrip();
  loadZones();
  loadProximalAlerts();
}

// Initial load
loadHeaderStrip();
loadZones();
loadInstruments();
loadSettings();
loadFiiDii();
loadNews();
loadProximalAlerts();
loadTradeHistory();
connectAlertsSocket();

// Poll every 15s for the live bits (header/zones) - WebSocket handles
// proximal alerts in real time, but this stays as a safety-net refresh.
setInterval(refreshAll, 15000);
</script>
</body>
</html>
