<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Zone Trading Terminal</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card: #151b2b;
      --border: #222d42;
      --accent: #2962ff;
      --green: #089981;
      --red: #f23645;
      --text: #e0e3eb;
      --muted: #848e9c;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding-bottom: 75px; -webkit-tap-highlight-color: transparent; }
    
    /* Top Bar */
    .topbar { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: #0f1523; border-bottom: 1px solid var(--border); }
    .topbar h1 { font-size: 18px; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 6px; }
    .badge { font-size: 11px; padding: 3px 8px; border-radius: 4px; font-weight: 600; text-transform: uppercase; }
    .badge.paper { background: #2a3b5c; color: #64b5f6; }
    .badge.algo { background: #4a1525; color: #ff5252; }

    /* Header Strip - Clickable TradingView */
    .header-scroll { overflow-x: auto; white-space: nowrap; display: flex; gap: 8px; padding: 10px 14px; background: #121826; border-bottom: 1px solid var(--border); }
    .header-scroll::-webkit-scrollbar { display: none; }
    .sym-chip { display: inline-flex; flex-direction: column; background: var(--card); border: 1px solid var(--border); padding: 6px 12px; border-radius: 8px; text-decoration: none; min-width: 95px; }
    .sym-chip .s-name { font-size: 11px; color: var(--muted); font-weight: 600; }
    .sym-chip .s-price { font-size: 13px; font-weight: bold; color: #fff; margin-top: 2px; }
    .sym-chip .s-chg { font-size: 11px; font-weight: 600; }
    .up { color: var(--green) !important; }
    .down { color: var(--red) !important; }

    /* Container & Tabs */
    .container { padding: 14px; max-width: 1000px; margin: 0 auto; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Zone Card */
    .zone-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 12px; position: relative; }
    .zone-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .zone-title { font-size: 16px; font-weight: bold; display: flex; align-items: center; gap: 8px; }
    .tag { font-size: 11px; padding: 3px 6px; border-radius: 4px; font-weight: bold; }
    .tag.demand { background: rgba(8,153,129,0.15); color: var(--green); border: 1px solid var(--green); }
    .tag.supply { background: rgba(242,54,69,0.15); color: var(--red); border: 1px solid var(--red); }
    
    .grid-info { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; background: #0f1524; padding: 10px; border-radius: 6px; margin: 8px 0; }
    .grid-info div { display: flex; flex-direction: column; }
    .grid-info span { font-size: 10px; color: var(--muted); }
    .grid-info b { font-size: 13px; margin-top: 2px; }

    .hypothesis-box { font-size: 12px; color: #abb7c9; line-height: 1.4; padding: 6px 0; border-top: 1px solid #1c2538; margin-top: 6px; }
    .actions { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--border); }
    .chart-link { color: var(--accent); text-decoration: none; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
    
    /* Order Buttons */
    .btn-exec { background: var(--accent); color: #fff; border: none; padding: 8px 16px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; }
    .btn-exec:active { opacity: 0.8; }

    /* News and Events */
    .news-card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-bottom: 8px; }
    .news-title { font-size: 13px; font-weight: 600; color: #fff; margin-bottom: 4px; }
    .news-meta { font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; }

    /* Bottom Navigation */
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 60px; background: #0e1320; border-top: 1px solid var(--border); display: flex; z-index: 100; }
    .nav-btn { flex: 1; border: none; background: transparent; color: var(--muted); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 600; cursor: pointer; }
    .nav-btn.active { color: #fff; border-top: 2px solid var(--accent); }
    
    /* Form */
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; }
    .form-control { width: 100%; padding: 10px; background: var(--card); border: 1px solid var(--border); border-radius: 6px; color: #fff; font-size: 14px; }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <div class="topbar">
    <h1>⚡ Zone Terminal</h1>
    <span id="modeBadge" class="badge paper">PAPER</span>
  </div>

  <!-- Header Strip (TradingView Integrated) -->
  <div class="header-scroll" id="headerStrip">
    <!-- Populated via JS -->
  </div>

  <!-- Main Views -->
  <div class="container">
    <!-- 1. ZONES PAGE -->
    <div id="tab-zones" class="tab-content active">
      <div id="zonesList">
        <!-- अगर ज़ोन नहीं होगा तो यह खाली रहेगा (ब्लैंक) -->
      </div>
    </div>

    <!-- 2. INSTRUMENTS & NEWS PAGE -->
    <div id="tab-instruments" class="tab-content">
      <div style="font-weight: 600; font-size: 14px; margin-bottom: 8px;">📡 लाइव मार्केट और समाचार</div>
      <div id="newsList">Loading events...</div>
      <div style="margin-top: 15px; font-weight: 600; font-size: 14px; margin-bottom: 8px;">📊 वॉचलिस्ट शेयर्स</div>
      <div id="instList">Loading prices...</div>
    </div>

    <!-- 3. SETTINGS PAGE -->
    <div id="tab-settings" class="tab-content">
      <div class="zone-card">
        <div class="form-group">
          <label>ट्रेडिंग मोड (Mode)</label>
          <select id="setMode" class="form-control">
            <option value="paper">Paper Trading (Safe)</option>
            <option value="algo">Algo Trading (Auto Dhan)</option>
            <option value="manual">Manual Journal</option>
          </select>
        </div>
        <div class="form-group">
          <label>कैपिटल (₹)</label>
          <input type="number" id="setCapital" class="form-control" value="25000">
        </div>
        <div class="form-group">
          <label>रिस्क प्रति ट्रेड (%)</label>
          <input type="number" id="setRisk" class="form-control" value="0.5" step="0.1">
        </div>
        <div class="form-group">
          <label>Target RR</label>
          <input type="number" id="setRR" class="form-control" value="3.0" readonly>
        </div>
        <button class="btn-exec" style="width: 100%; margin-top: 10px;" onclick="saveSettings()">सेव करें</button>
      </div>
    </div>
  </div>

  <!-- Bottom Nav -->
  <div class="bottom-nav">
    <button class="nav-btn active" onclick="switchTab('zones')">📊 <span>Zones</span></button>
    <button class="nav-btn" onclick="switchTab('instruments')">🌐 <span>News & Watch</span></button>
    <button class="nav-btn" onclick="switchTab('settings')">⚙️ <span>Settings</span></button>
  </div>

  <script>
    const API = "";

    // TradingView Links map
    const TV_MAP = {
      "NIFTY1!": "NSE:NIFTY",
      "GIFTNIFTY": "NSE:NIFTY",
      "DXY": "TVC:DXY",
      "USDINR": "FX_IDC:USDINR",
      "US10Y": "TVC:US10Y",
      "XAUUSD": "TVC:GOLD",
      "SPOTCRUDE": "TVC:USOIL",
      "US500": "TVC:SPX"
    };

    function switchTab(name) {
      document.querySelectorAll('.tab-content').forEach(e => e.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(e => e.classList.remove('active'));
      document.getElementById('tab-' + name).classList.add('active');
      event.currentTarget.classList.add('active');
      if (name === 'instruments') loadNewsAndInstruments();
    }

    async function loadHeader() {
      try {
        const res = await fetch(`${API}/api/instruments/header`);
        const data = await res.json();
        const box = document.getElementById("headerStrip");
        box.innerHTML = data.header.map(item => {
          const sym = item.symbol;
          const p = item.price;
          const tvSym = TV_MAP[sym] || `NSE:${sym}`;
          const tvLink = `https://www.tradingview.com/chart/?symbol=${tvSym}`;
          const isUp = (p && p.change_pct >= 0);
          return `
            <a href="${tvLink}" target="_blank" class="sym-chip">
              <span class="s-name">${sym}</span>
              <span class="s-price">${p && p.price ? p.price : "-"}</span>
              <span class="s-chg ${isUp ? 'up' : 'down'}">${p && p.change_pct !== undefined ? (isUp?'+':'') + p.change_pct.toFixed(2) + '%' : '-'}</span>
            </a>
          `;
        }).join('');
      } catch (err) { console.error(err); }
    }

    async function loadZones() {
      try {
        const res = await fetch(`${API}/api/zones?eligible_only=true`);
        const data = await res.json();
        const box = document.getElementById("zonesList");
        
        // यदि कोई ज़ोन नहीं है तो स्क्रीन बिल्कुल खाली (Blank) रहेगी
        if (!data.zones || data.zones.length === 0) {
          box.innerHTML = "";
          return;
        }

        box.innerHTML = data.zones.map(z => {
          const isDemand = z.isDemand;
          const tvSym = `NSE:${z.symbol}`;
          const tvLink = `https://www.tradingview.com/chart/?symbol=${tvSym}`;
          
          // Auto Calculate 1:3 RR with Buffer
          const buffer = (z.entry * 0.001); // 0.1% buffer
          const stoploss = isDemand ? (z.distVal - buffer) : (z.distVal + buffer);
          const risk = Math.abs(z.entry - stoploss);
          const target = isDemand ? (z.entry + risk * 3) : (z.entry - risk * 3);

          return `
            <div class="zone-card">
              <div class="zone-head">
                <div class="zone-title">
                  <span>${z.symbol}</span>
                  <span class="tag ${isDemand ? 'demand':'supply'}">${isDemand ? 'DEMAND (BUY)' : 'SUPPLY (SELL)'}</span>
                </div>
                <span style="font-size: 11px; color: var(--muted);">${z.timeframe}</span>
              </div>
              <div class="grid-info">
                <div><span>Proximal (Entry)</span><b>₹${z.entry.toFixed(2)}</b></div>
                <div><span>Distal (SL)</span><b>₹${stoploss.toFixed(2)}</b></div>
                <div><span>Target (1:3)</span><b>₹${target.toFixed(2)}</b></div>
                <div><span>Quantity</span><b>${z.quantity || 1}</b></div>
              </div>
              <div class="hypothesis-box">💡 ${z.hypothesis || "विपरीत बाज़ार ट्रेंड की पुष्टि के बाद एंट्री लें।"}</div>
              <div class="actions">
                <a href="${tvLink}" target="_blank" class="chart-link">📈 View TradingView Chart</a>
                <button class="btn-exec" onclick='triggerTrade(${JSON.stringify(z)}, ${stoploss}, ${target})'>
                  ⚡ Execute Trade
                </button>
              </div>
            </div>
          `;
        }).join('');
      } catch (err) { console.error(err); }
    }

    async function triggerTrade(zone, sl, target) {
      const mode = document.getElementById("modeBadge").innerText.toLowerCase();
      let confirmMsg = `${zone.symbol} पर ${zone.isDemand ? 'BUY':'SELL'} ऑर्डर भेजें?\nEntry: ₹${zone.entry}\nSL: ₹${sl.toFixed(2)}\nTarget: ₹${target.toFixed(2)}`;
      
      if (!confirm(confirmMsg)) return;

      zone.stoploss = sl;
      zone.target = target;

      try {
        const res = await fetch(`${API}/api/execute`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ setup: zone, confirm: true })
        });
        const out = await res.json();
        alert(out.message || "ट्रेड प्रोसेस हो गई।");
      } catch (err) {
        alert("ऑर्डर भेजने में विफल: " + err);
      }
    }

    async function loadNewsAndInstruments() {
      // News
      try {
        const res = await fetch(`${API}/api/news`);
        const data = await res.json();
        const box = document.getElementById("newsList");
        if (data.items && data.items.length) {
          box.innerHTML = data.items.slice(0, 5).map(n => `
            <div class="news-card">
              <div class="news-title">${n.headline}</div>
              <div class="news-meta"><span>${n.source || 'Verified'}</span><span>${n.severity || 'Normal'}</span></div>
            </div>
          `).join('');
        } else {
          box.innerHTML = "<div style='color: var(--muted); font-size:12px;'>कोई बड़ा इवेंट नहीं।</div>";
        }
      } catch(e) {}
    }

    async function loadSettings() {
      try {
        const res = await fetch(`${API}/api/settings`);
        const s = await res.json();
        const badge = document.getElementById("modeBadge");
        badge.innerText = s.trading_mode || "PAPER";
        badge.className = "badge " + (s.trading_mode === 'algo' ? 'algo' : 'paper');
        document.getElementById("setMode").value = s.trading_mode || 'paper';
        document.getElementById("setCapital").value = s.capital || 25000;
        document.getElementById("setRisk").value = s.risk_pct || 0.5;
      } catch(e) {}
    }

    async function saveSettings() {
      const mode = document.getElementById("setMode").value;
      const capital = parseFloat(document.getElementById("setCapital").value);
      const risk_pct = parseFloat(document.getElementById("setRisk").value);

      await fetch(`${API}/api/settings`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ trading_mode: mode, capital: capital, risk_pct: risk_pct, target_rr: 3.0 })
      });
      alert("Settings सेव हो गई!");
      loadSettings();
    }

    // Auto Polling
    loadHeader();
    loadZones();
    loadSettings();
    setInterval(loadHeader, 10000); // 10s header refresh
    setInterval(loadZones, 15000);  // 15s zone scan refresh
  </script>
</body>
</html>
